ight="400" fill="#3F3B3B">2024</text><rect x="1030.2" y="695.5" width="44.0" height="304.5" fill="#B8860B"></rect><rect x="1030.2" y="460.6" width="44.0" height="234.9" fill="#E3CF9C"></rect><text x="1052.2" y="450.6" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="17" font-weight="500" fill="#666666">12.6k</text><text x="1052.2" y="1030.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="18" font-weight="400" fill="#3F3B3B">’25</text><rect x="1091.4" y="695.5" width="44.0" height="304.5" fill="#B8860B"></rect><rect x="1091.4" y="431.2" width="44.0" height="264.3" fill="#E3CF9C"></rect><text x="1113.4" y="421.2" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="20" font-weight="700" fill="#282424">13.3k</text><text x="1113.4" y="1030.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="18" font-weight="500" fill="#3F3B3B">2026*</text><text x="1113.4" y="988.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">7,106</text><rect x="144" y="440" width="420" height="132" rx="12" fill="#FFFFFF" stroke="#E8E6E3"></rect><text x="168.0" y="516.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="64" font-weight="700" fill="#B8860B">×4.2</text><text x="312.0" y="490.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="20" font-weight="400" fill="#3F3B3B">1,685 at the start</text><text x="312.0" y="516.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="20" font-weight="400" fill="#3F3B3B">of 2018, 7,106 now,</text><text x="312.0" y="542.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="20" font-weight="400" fill="#3F3B3B">in the laws themselves</text><line x1="56" x2="1144" y1="1066" y2="1066" stroke="#E8E6E3"></line><text x="56.0" y="1100.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">* As of October 2026. Automated count of the 105 adopted EU digital acts in the CEPS inventory and their 690 implementing</text><text x="56.0" y="1124.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">and delegated acts, original texts from EUR-Lex; each obligation coded by who must act. Including the implementing and delegated</text><text x="56.0" y="1148.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">acts, obligations on companies rose ×6.3 over the same period.</text><g transform="translate(870,1160)"><rect x="0" y="0" width="22" height="22" rx="3" fill="none" stroke="#282424" stroke-width="1.6"></rect><path d="M5 15h12M5 11h12M5 7h7" stroke="#B8860B" stroke-width="1.6" stroke-linecap="round"></path></g><text x="902.0" y="1178.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="400" fill="#282424">The EU Digital Rulebook</text><text x="56.0" y="1180.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="500" fill="#3F3B3B">Source: The EU Digital Rulebook (2026)</text></svg>