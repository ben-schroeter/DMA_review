<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" role="img" aria-label="The AI Act carries three times as many obligations as Sarbanes-Oxley: AI Act 764; DSA 477; GDPR 415; DMA 279; Data Act 262; EU average, acts since 2020 251; Sarbanes-Oxley Act (US, 2002) 240; EU average, all 105 acts 204"><rect width="1200" height="1200" fill="#FAF9F5"></rect><rect width="1200" height="10" fill="#B8860B"></rect><text x="56.0" y="112.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="50" font-weight="700" fill="#282424">The AI Act carries three times as many</text><text x="56.0" y="172.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="50" font-weight="700" fill="#282424">obligations as Sarbanes-Oxley</text><text x="56.0" y="228.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="24" font-weight="400" fill="#666666">Obligations per act: major EU digital laws and EU averages against the US</text><text x="56.0" y="260.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="24" font-weight="400" fill="#666666">Sarbanes-Oxley Act (2002), counted the same way</text><line x1="583.0" x2="583.0" y1="314" y2="1020" stroke="#5C5858" stroke-width="1.5" stroke-dasharray="6 5"></line><text x="591.0" y="324.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" font-weight="600" fill="#5C5858">Sarbanes-Oxley: 240</text><text x="354.0" y="374.8" text-anchor="end" font-family="DM Sans, sans-serif" font-size="21" font-weight="600" fill="#282424">AI Act</text><rect x="370" y="336.0" width="678.0" height="63.5" rx="4" fill="#B8860B"></rect><text x="1060.0" y="375.8" text-anchor="start" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" fill="#282424">764</text><text x="354.0" y="462.2" text-anchor="end" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#3F3B3B">DSA</text><rect x="370" y="423.5" width="423.3" height="63.5" rx="4" fill="#B8860B"></rect><text x="805.3" y="463.2" text-anchor="start" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" fill="#282424">477</text><text x="354.0" y="549.8" text-anchor="end" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#3F3B3B">GDPR</text><rect x="370" y="511.0" width="368.3" height="63.5" rx="4" fill="#B8860B"></rect><text x="750.3" y="550.8" text-anchor="start" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" fill="#282424">415</text><text x="354.0" y="637.2" text-anchor="end" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#3F3B3B">DMA</text><rect x="370" y="598.5" width="247.6" height="63.5" rx="4" fill="#B8860B"></rect><text x="629.6" y="638.2" text-anchor="start" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" fill="#282424">279</text><text x="354.0" y="724.8" text-anchor="end" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#3F3B3B">Data Act</text><rect x="370" y="686.0" width="232.5" height="63.5" rx="4" fill="#B8860B"></rect><text x="614.5" y="725.8" text-anchor="start" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" fill="#282424">262</text><text x="354.0" y="812.2" text-anchor="end" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#3F3B3B">EU average, acts since 2020</text><rect x="370" y="773.5" width="222.8" height="63.5" rx="4" fill="#C4C1BE"></rect><text x="604.8" y="813.2" text-anchor="start" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" fill="#282424">251</text><text x="354.0" y="899.8" text-anchor="end" font-family="DM Sans, sans-serif" font-size="21" font-weight="600" fill="#282424">Sarbanes-Oxley Act (US, 2002)</text><rect x="370" y="861.0" width="213.0" height="63.5" rx="4" fill="#5C5858"></rect><text x="595.0" y="900.8" text-anchor="start" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" fill="#282424">240</text><text x="354.0" y="987.2" text-anchor="end" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#3F3B3B">EU average, all 105 acts</text><rect x="370" y="948.5" width="181.1" height="63.5" rx="4" fill="#C4C1BE"></rect><text x="563.0" y="988.2" text-anchor="start" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" fill="#282424">204</text><rect x="714" y="642.25" width="430" height="100" rx="12" fill="#FFFFFF" stroke="#E8E6E3"></rect><text x="738.0" y="714.2" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="64" font-weight="700" fill="#B8860B">×3.2</text><text x="896.0" y="686.2" text-anchor="start" font-family="DM Sans, sans-serif" font-size="20" font-weight="400" fill="#3F3B3B">obligations in the AI Act</text><text x="896.0" y="712.2" text-anchor="start" font-family="DM Sans, sans-serif" font-size="20" font-weight="400" fill="#3F3B3B">vs Sarbanes-Oxley</text><line x1="56" x2="1144" y1="1066" y2="1066" stroke="#E8E6E3"></line><text x="56.0" y="1100.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">Automated count of obligations in the legal text (articles and annexes; for Sarbanes-Oxley, the enacted text). The counter was</text><text x="56.0" y="1124.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">89% precise on EU texts and 68% on Sarbanes-Oxley, so the US figure is likely overstated rather than understated. As of October 2026.</text><g transform="translate(870,1160)"><rect x="0" y="0" width="22" height="22" rx="3" fill="none" stroke="#282424" stroke-width="1.6"></rect><path d="M5 15h12M5 11h12M5 7h7" stroke="#B8860B" stroke-width="1.6" stroke-linecap="round"></path></g><text x="902.0" y="1178.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="400" fill="#282424">The EU Digital Rulebook</text><text x="56.0" y="1180.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="500" fill="#3F3B3B">Source: The EU Digital Rulebook (2026) · <tspan fill="#B8860B" font-weight="700" font-size="18">eutechlaws.org</tspan></text></svg>