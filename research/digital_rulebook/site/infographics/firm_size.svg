<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" role="img" aria-label="Obligations that apply to a firm of each size: Makers of connected products from 4,908 (micro) to 5,631; Finance, payments and crypto from 5,056 (micro) to 5,448; Cloud, data and AI from 2,649 (micro) to 3,288; Telecoms from 2,871 (micro) to 3,244; Online platforms from 2,344 (micro) to 3,418; Any other company in the digital economy from 1,596 (micro) to 1,966"><rect width="1200" height="1200" fill="#FAF9F5"></rect><rect width="1200" height="10" fill="#B8860B"></rect><text x="56.0" y="112.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="50" font-weight="700" fill="#282424">Even a micro firm in finance faces</text><text x="56.0" y="172.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="50" font-weight="700" fill="#282424">about 5,100 EU obligations</text><text x="56.0" y="228.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="24" font-weight="400" fill="#666666">Obligations that apply to a firm of each size, by type of company</text><line x1="56" x2="90" y1="293" y2="293" stroke="#B8860B" stroke-width="5"></line><text x="102.0" y="300.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="600" fill="#282424">Makers of connected products</text><text x="102.0" y="322.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" font-weight="400" fill="#666666">4,908 at micro → 5,631 at large</text><line x1="616" x2="650" y1="293" y2="293" stroke="#8F6708" stroke-width="5"></line><text x="662.0" y="300.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="600" fill="#282424">Finance, payments and crypto</text><text x="662.0" y="322.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" font-weight="400" fill="#666666">5,056 at micro → 5,448 at large</text><line x1="56" x2="90" y1="345" y2="345" stroke="#004494" stroke-width="5"></line><text x="102.0" y="352.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="600" fill="#282424">Cloud, data and AI</text><text x="102.0" y="374.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" font-weight="400" fill="#666666">2,649 at micro → 3,288 designated</text><line x1="616" x2="650" y1="345" y2="345" stroke="#5C5858" stroke-width="5"></line><text x="662.0" y="352.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="600" fill="#282424">Telecoms</text><text x="662.0" y="374.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" font-weight="400" fill="#666666">2,871 at micro → 3,244 at large</text><line x1="56" x2="90" y1="397" y2="397" stroke="#7FA3CC" stroke-width="5"></line><text x="102.0" y="404.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="600" fill="#282424">Online platforms</text><text x="102.0" y="426.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" font-weight="400" fill="#666666">2,344 at micro → 3,418 designated</text><line x1="616" x2="650" y1="397" y2="397" stroke="#A6A3A0" stroke-width="5" stroke-dasharray="8 6"></line><text x="662.0" y="404.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="600" fill="#282424">Any other company in the digital economy</text><text x="662.0" y="426.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" font-weight="400" fill="#666666">1,596 at micro → 1,966 at large</text><line x1="140" x2="1110" y1="960.0" y2="960.0" stroke="#C9C6C3"></line><text x="126.0" y="967.0" text-anchor="end" font-family="DM Sans, sans-serif" font-size="19" font-weight="400" fill="#666666">0</text><line x1="140" x2="1110" y1="878.3" y2="878.3" stroke="#E8E6E3"></line><text x="126.0" y="885.3" text-anchor="end" font-family="DM Sans, sans-serif" font-size="19" font-weight="400" fill="#666666">1,000</text><line x1="140" x2="1110" y1="796.7" y2="796.7" stroke="#E8E6E3"></line><text x="126.0" y="803.7" text-anchor="end" font-family="DM Sans, sans-serif" font-size="19" font-weight="400" fill="#666666">2,000</text><line x1="140" x2="1110" y1="715.0" y2="715.0" stroke="#E8E6E3"></line><text x="126.0" y="722.0" text-anchor="end" font-family="DM Sans, sans-serif" font-size="19" font-weight="400" fill="#666666">3,000</text><line x1="140" x2="1110" y1="633.3" y2="633.3" stroke="#E8E6E3"></line><text x="126.0" y="640.3" text-anchor="end" font-family="DM Sans, sans-serif" font-size="19" font-weight="400" fill="#666666">4,000</text><line x1="140" x2="1110" y1="551.7" y2="551.7" stroke="#E8E6E3"></line><text x="126.0" y="558.7" text-anchor="end" font-family="DM Sans, sans-serif" font-size="19" font-weight="400" fill="#666666">5,000</text><line x1="140" x2="1110" y1="470.0" y2="470.0" stroke="#E8E6E3"></line><text x="126.0" y="477.0" text-anchor="end" font-family="DM Sans, sans-serif" font-size="19" font-weight="400" fill="#666666">6,000</text><text x="170.0" y="992.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="20" font-weight="600" fill="#282424">Micro</text><text x="170.0" y="1016.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">under 10 staff</text><text x="352.0" y="992.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="20" font-weight="600" fill="#282424">Small</text><text x="352.0" y="1016.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">10–49</text><text x="534.0" y="992.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="20" font-weight="600" fill="#282424">Medium</text><text x="534.0" y="1016.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">50–249</text><text x="716.0" y="992.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="20" font-weight="600" fill="#282424">Small mid-cap</text><text x="716.0" y="1016.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">250–749</text><text x="898.0" y="992.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="20" font-weight="600" fill="#282424">Large</text><text x="898.0" y="1016.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">750+</text><text x="1080.0" y="992.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="20" font-weight="600" fill="#282424">Designated</text><text x="1080.0" y="1016.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">gatekeepers, VLOPs, GPAI</text><path d="M170.0,559.2 L352.0,556.6 L534.0,530.4 L716.0,530.4 L898.0,500.1" fill="none" stroke="#B8860B" stroke-width="5" stroke-linejoin="round"></path><circle cx="170.0" cy="559.2" r="7" fill="#B8860B" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="352.0" cy="556.6" r="7" fill="#B8860B" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="534.0" cy="530.4" r="7" fill="#B8860B" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="716.0" cy="530.4" r="7" fill="#B8860B" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="898.0" cy="500.1" r="7" fill="#B8860B" stroke="#FAF9F5" stroke-width="2"></circle><path d="M170.0,547.1 L352.0,545.3 L534.0,545.3 L716.0,545.3 L898.0,515.1" fill="none" stroke="#8F6708" stroke-width="5" stroke-linejoin="round"></path><circle cx="170.0" cy="547.1" r="7" fill="#8F6708" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="352.0" cy="545.3" r="7" fill="#8F6708" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="534.0" cy="545.3" r="7" fill="#8F6708" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="716.0" cy="545.3" r="7" fill="#8F6708" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="898.0" cy="515.1" r="7" fill="#8F6708" stroke="#FAF9F5" stroke-width="2"></circle><path d="M170.0,743.7 L352.0,743.5 L534.0,721.9 L716.0,721.9 L898.0,691.7 L1080.0,691.5" fill="none" stroke="#004494" stroke-width="5" stroke-linejoin="round"></path><circle cx="170.0" cy="743.7" r="7" fill="#004494" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="352.0" cy="743.5" r="7" fill="#004494" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="534.0" cy="721.9" r="7" fill="#004494" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="716.0" cy="721.9" r="7" fill="#004494" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="898.0" cy="691.7" r="7" fill="#004494" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="1080.0" cy="691.5" r="7" fill="#004494" stroke="#FAF9F5" stroke-width="2"></circle><path d="M170.0,725.5 L352.0,725.5 L534.0,725.3 L716.0,725.3 L898.0,695.1" fill="none" stroke="#5C5858" stroke-width="5" stroke-linejoin="round"></path><circle cx="170.0" cy="725.5" r="7" fill="#5C5858" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="352.0" cy="725.5" r="7" fill="#5C5858" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="534.0" cy="725.3" r="7" fill="#5C5858" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="716.0" cy="725.3" r="7" fill="#5C5858" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="898.0" cy="695.1" r="7" fill="#5C5858" stroke="#FAF9F5" stroke-width="2"></circle><path d="M170.0,768.6 L352.0,768.6 L534.0,740.7 L716.0,740.7 L898.0,710.5 L1080.0,680.9" fill="none" stroke="#7FA3CC" stroke-width="5" stroke-linejoin="round"></path><circle cx="170.0" cy="768.6" r="7" fill="#7FA3CC" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="352.0" cy="768.6" r="7" fill="#7FA3CC" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="534.0" cy="740.7" r="7" fill="#7FA3CC" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="716.0" cy="740.7" r="7" fill="#7FA3CC" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="898.0" cy="710.5" r="7" fill="#7FA3CC" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="1080.0" cy="680.9" r="7" fill="#7FA3CC" stroke="#FAF9F5" stroke-width="2"></circle><path d="M170.0,829.7 L352.0,829.7 L534.0,829.7 L716.0,829.7 L898.0,799.4" fill="none" stroke="#A6A3A0" stroke-width="3.5" stroke-dasharray="8 6" stroke-linejoin="round"></path><circle cx="170.0" cy="829.7" r="7" fill="#A6A3A0" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="352.0" cy="829.7" r="7" fill="#A6A3A0" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="534.0" cy="829.7" r="7" fill="#A6A3A0" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="716.0" cy="829.7" r="7" fill="#A6A3A0" stroke="#FAF9F5" stroke-width="2"></circle><circle cx="898.0" cy="799.4" r="7" fill="#A6A3A0" stroke="#FAF9F5" stroke-width="2"></circle><line x1="56" x2="1144" y1="1066" y2="1066" stroke="#E8E6E3"></line><text x="56.0" y="1100.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">Obligations for the firm’s type plus those for any company in the digital economy, counting size thresholds and SME relief in the laws.</text><text x="56.0" y="1124.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">Online platforms continue as gatekeepers and very large platforms; cloud, data and AI as providers of general-purpose AI models with</text><text x="56.0" y="1148.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">systemic risk. Main laws and their implementing and delegated acts, as of October 2026.</text><g transform="translate(870,1160)"><rect x="0" y="0" width="22" height="22" rx="3" fill="none" stroke="#282424" stroke-width="1.6"></rect><path d="M5 15h12M5 11h12M5 7h7" stroke="#B8860B" stroke-width="1.6" stroke-linecap="round"></path></g><text x="902.0" y="1178.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="400" fill="#282424">The EU Digital Rulebook</text><text x="56.0" y="1180.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="500" fill="#3F3B3B">Source: The EU Digital Rulebook (2026) · <tspan fill="#B8860B" font-weight="700" font-size="18">eutechlaws.org</tspan></text></svg>