erif" font-size="16" font-weight="400" fill="#666666">110 adopted EU digital acts and their 812 implementing and delegated acts; “new”: no such obligations before 2018. Counts measure</text><text x="56.0" y="1148.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">the number of rules, not their cost. Acts repealed before 2018 are not in the inventory, so earlier totals are a lower bound.</text><g transform="translate(870,1160)"><rect x="0" y="0" width="22" height="22" rx="3" fill="none" stroke="#282424" stroke-width="1.6"></rect><path d="M5 15h12M5 11h12M5 7h7" stroke="#B8860B" stroke-width="1.6" stroke-linecap="round"></path></g><text x="902.0" y="1178.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="400" fill="#282424">The EU Digital Rulebook</text><text x="56.0" y="1180.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="500" fill="#3F3B3B">Source: The EU Digital Rulebook (2026) · <tspan fill="#B8860B" font-weight="700" font-size="18">eutechlaws.org</tspan></text></svg>