<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" role="img" aria-label="65% of EU obligations on companies say exactly what to do: prescriptive rules 65%, performance rules 7%, management-based duties 7%, general duties 21%."><rect width="1200" height="1200" fill="#FAF9F5"></rect><rect width="1200" height="10" fill="#B8860B"></rect><text x="56.0" y="112.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="50" font-weight="700" fill="#282424">65% of EU obligations on companies</text><text x="56.0" y="172.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="50" font-weight="700" fill="#282424">say exactly what to do</text><text x="56.0" y="228.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="24" font-weight="400" fill="#666666">Obligations on companies in the main EU digital laws, by regulatory design</text><text x="425.0" y="362.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="24" font-weight="700" fill="#282424">Means: what to do</text><text x="911.0" y="362.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="24" font-weight="700" fill="#282424">Ends: what to achieve</text><text x="56.0" y="536.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="24" font-weight="700" fill="#282424">Specific</text><text x="56.0" y="872.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="24" font-weight="700" fill="#282424">General</text><rect x="190" y="380" width="470" height="320" rx="14" fill="#8F6708"></rect><text x="222.0" y="516.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="108" font-weight="700" fill="#FFFFFF">65%</text><text x="222.0" y="580.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Prescriptive rule</text><text x="222.0" y="620.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#FFFFFF">The law says what to do</text><rect x="676" y="380" width="470" height="320" rx="14" fill="#D9B86A"></rect><text x="708.0" y="516.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="108" font-weight="700" fill="#282424">7%</text><text x="708.0" y="580.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="31" font-weight="700" fill="#282424">Performance rule</text><text x="708.0" y="620.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#282424">A specific result; the firm chooses how</text><rect x="190" y="716" width="470" height="320" rx="14" fill="#4F7FB3"></rect><text x="222.0" y="852.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="108" font-weight="700" fill="#FFFFFF">7%</text><text x="222.0" y="916.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Management-based duty</text><text x="222.0" y="956.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#FFFFFF">Set up and run a system the firm designs</text><rect x="676" y="716" width="470" height="320" rx="14" fill="#9DBBDB"></rect><text x="708.0" y="852.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="108" font-weight="700" fill="#282424">21%</text><text x="708.0" y="916.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="31" font-weight="700" fill="#282424">General duty</text><text x="708.0" y="956.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="21" font-weight="400" fill="#282424">An open-ended result, judged afterwards</text><line x1="56" x2="1144" y1="1066" y2="1066" stroke="#E8E6E3"></line><text x="56.0" y="1100.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">6,491 obligations on companies in the 100 adopted main laws, each coded by what it fixes (the means or the end) and how precisely</text><text x="56.0" y="1124.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">(specific or general), following C. Coglianese’s regulatory design framework. Obligations that set no duty, leave matters to member states</text><text x="56.0" y="1148.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="400" fill="#666666">or are specified later are not shown. Coding by AI readers, checked against a hand-coded sample (89% agreement).</text><g transform="translate(870,1160)"><rect x="0" y="0" width="22" height="22" rx="3" fill="none" stroke="#282424" stroke-width="1.6"></rect><path d="M5 15h12M5 11h12M5 7h7" stroke="#B8860B" stroke-width="1.6" stroke-linecap="round"></path></g><text x="902.0" y="1178.0" text-anchor="start" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="400" fill="#282424">The EU Digital Rulebook</text><text x="56.0" y="1180.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="16" font-weight="500" fill="#3F3B3B">Source: The EU Digital Rulebook (2026) · <tspan fill="#B8860B" font-weight="700" font-size="18">eutechlaws.org</tspan></text></svg>