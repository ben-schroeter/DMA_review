<svg viewBox="0 0 1000 546" width="100%" role="img" aria-label="Regulatory design grid, obligations on companies in the main laws: Prescriptive rule 65%; Performance rule 7%; Management-based duty 7%; General duty 21%"><text x="359.0" y="30.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" fill="#282424" font-weight="600">Means: what to do</text><text x="791.0" y="30.0" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" fill="#282424" font-weight="600">Ends: what to achieve</text><text x="0.0" y="170.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="14" fill="#282424" font-weight="600">Micro:</text><text x="0.0" y="188.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#3F3B3B">specific</text><text x="0.0" y="420.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="14" fill="#282424" font-weight="600">Macro:</text><text x="0.0" y="438.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#3F3B3B">general</text><rect x="150" y="56" width="418" height="236" rx="10" fill="#8F6708"><title>Prescriptive rule: 65% of obligations on companies in the main laws</title></rect><text x="172.0" y="114.0" text-anchor="start" font-family="Source Serif 4, Georgia, serif" font-size="44" fill="#FFFFFF">65%</text><text x="172.0" y="146.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" fill="#FFFFFF" font-weight="600">Prescriptive rule</text><text x="172.0" y="168.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13.5" fill="#F3EBD6">The law says what to do</text><text x="172.0" y="202.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#F3EBD6" font-style="italic">“Roaming providers shall charge … on a per-kilobyte</text><text x="172.0" y="221.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#F3EBD6" font-style="italic">basis”</text><text x="172.0" y="274.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="12" fill="#F3EBD6">Roaming Regulation</text><rect x="582" y="56" width="418" height="236" rx="10" fill="#D9B86A"><title>Performance rule: 7% of obligations on companies in the main laws</title></rect><text x="604.0" y="114.0" text-anchor="start" font-family="Source Serif 4, Georgia, serif" font-size="44" fill="#282424">7%</text><text x="604.0" y="146.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" fill="#282424" font-weight="600">Performance rule</text><text x="604.0" y="168.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13.5" fill="#3F3B3B">A specific result; the firm chooses how</text><text x="604.0" y="202.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#3F3B3B" font-style="italic">“ensure that the payee receives the full amount of the</text><text x="604.0" y="221.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#3F3B3B" font-style="italic">payment transaction”</text><text x="604.0" y="274.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="12" fill="#3F3B3B">PSD2</text><rect x="150" y="306" width="418" height="236" rx="10" fill="#4F7FB3"><title>Management-based duty: 7% of obligations on companies in the main laws</title></rect><text x="172.0" y="364.0" text-anchor="start" font-family="Source Serif 4, Georgia, serif" font-size="44" fill="#FFFFFF">7%</text><text x="172.0" y="396.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" fill="#FFFFFF" font-weight="600">Management-based duty</text><text x="172.0" y="418.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13.5" fill="#F3EBD6">Set up and run a system the firm designs</text><text x="172.0" y="452.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#F3EBD6" font-style="italic">“a sound, comprehensive and well-documented ICT risk</text><text x="172.0" y="471.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#F3EBD6" font-style="italic">management framework”</text><text x="172.0" y="524.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="12" fill="#F3EBD6">DORA</text><rect x="582" y="306" width="418" height="236" rx="10" fill="#9DBBDB"><title>General duty: 21% of obligations on companies in the main laws</title></rect><text x="604.0" y="364.0" text-anchor="start" font-family="Source Serif 4, Georgia, serif" font-size="44" fill="#282424">21%</text><text x="604.0" y="396.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="17" fill="#282424" font-weight="600">General duty</text><text x="604.0" y="418.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13.5" fill="#3F3B3B">An open-ended result, judged afterwards</text><text x="604.0" y="452.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#3F3B3B" font-style="italic">“appropriate and proportionate measures to ensure a</text><text x="604.0" y="471.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="13" fill="#3F3B3B" font-style="italic">high level of privacy, safety, and security of minors”</text><text x="604.0" y="524.0" text-anchor="start" font-family="DM Sans, sans-serif" font-size="12" fill="#3F3B3B">Digital Services Act</text></svg>